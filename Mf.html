    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
        }

        /* 篩選控制器區塊 */
        .filter-section {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        .filter-group select, .filter-group input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: var(--primary-color);
        }

        /* 統計資訊 */
        .stats {
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 500;
        }

        /* 歌曲表格樣式 */
        .table-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        /* 標籤樣式 */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .badge-cantonese { background-color: #dbeafe; color: #1e40af; }
        .badge-mandarin { background-color: #fef3c7; color: #92400e; }
        .badge-english { background-color: #d1fae5; color: #065f46; }
        .badge-other { background-color: #f3e8ff; color: #6b21a8; }

        .badge-year { background-color: #e2e8f0; color: #334155; }

        /* YouTube 按鈕 */
        .yt-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #ff0000;
            color: #ffffff;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        .yt-btn:hover {
            background-color: #cc0000;
            transform: translateY(-1px);
        }

        .yt-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* 無結果提示 */
        .no-results {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
    </style>
</head>

</div>

    // 取得 DOM 元素
    const searchInput = document.getElementById('search');
    const filterYear = document.getElementById('filterYear');
    const filterType = document.getElementById('filterType');
    const filterLang = document.getElementById('filterLang');
    const filterGender = document.getElementById('filterGender');
    const songTableBody = document.getElementById('songTableBody');
    const noResults = document.getElementById('noResults');
    const statsCount = document.getElementById('statsCount');

    // 語言 Badge 類別對應
    function getLangBadgeClass(lang) {
        switch(lang) {
            case '廣東話': return 'badge-cantonese';
            case '普通話': return 'badge-mandarin';
            case '英文': return 'badge-english';
            default: return 'badge-other';
        }
    }

    // 渲染歌曲列表
    function renderSongs() {
        const query = searchInput.value.trim().toLowerCase();
        const selectedYear = filterYear.value;
        const selectedType = filterType.value;
        const selectedLang = filterLang.value;
        const selectedGender = filterGender.value;

        const filtered = songData.filter(song => {
            const matchesQuery = song.title.toLowerCase().includes(query) || song.artist.toLowerCase().includes(query);
            const matchesYear = selectedYear === 'ALL' || song.year === selectedYear;
            const matchesType = selectedType === 'ALL' || song.type === selectedType;
            const matchesLang = selectedLang === 'ALL' || song.lang === selectedLang;
            const matchesGender = selectedGender === 'ALL' || song.gender === selectedGender;

            return matchesQuery && matchesYear && matchesType && matchesLang && matchesGender;
        });

        // 更新統計數據
        statsCount.textContent = `顯示 ${filtered.length} 首歌曲（共 ${songData.length} 首）`;

        // 清空現有表格內容
        songTableBody.innerHTML = '';

        if (filtered.length === 0) {
            noResults.style.display = 'block';
        } else {
            noResults.style.display = 'none';
            filtered.forEach(song => {
                const tr = document.createElement('tr');
                
                // 動態生成 YouTube 搜尋網址
                const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(song.title + ' ' + song.artist)}`;

                tr.innerHTML = `
                    <td><strong>${song.title}</strong></td>
                    <td>${song.artist}</td>
                    <td><span class="badge badge-year">${song.year}</span></td>
                    <td>${song.type}</td>
                    <td><span class="badge ${getLangBadgeClass(song.lang)}">${song.lang}</span></td>
                    <td>${song.gender}</td>
                    <td>
                        <a href="${ytSearchUrl}" target="_blank" class="yt-btn" title="在 YouTube 搜尋播放">
                            <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                            YouTube
                        </a>
                    </td>
                `;
                songTableBody.appendChild(tr);
            });
        }
    }

    // 監聽輸入事件
    searchInput.addEventListener('input', renderSongs);
    filterYear.addEventListener('change', renderSongs);
    filterType.addEventListener('change', renderSongs);
    filterLang.addEventListener('change', renderSongs);
    filterGender.addEventListener('change', renderSongs);

    // 初始化渲染
    renderSongs();
</script>
