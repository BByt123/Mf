<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>歷年音樂節獨唱歌曲庫</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8fafc; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 6px 12px; border-radius: 15px; border: 1px solid #ccc; cursor: pointer; }
        .active { background: #4f46e5; color: white; }
        .yt-link { background: red; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🎵 歷年音樂節獨唱歌曲庫</h2>
    <div>
        <button class="btn active" onclick="filter('all')">全部</button>
        <button class="btn" onclick="filter('female')">👩 女歌手</button>
        <button class="btn" onclick="filter('male')">👨 男歌手/樂隊</button>
    </div>
    <div id="list" style="margin-top:20px;"></div>

    <script>
        const songs = [
            { title: "雨愛", artist: "楊丞琳", gender: "female", year: "2023" },
            { title: "笑忘書", artist: "張敬軒", gender: "male", year: "2025" },
            { title: "填詞魂", artist: "謝雅兒", gender: "female", year: "2024" }
        ];

        function render(data) {
            document.getElementById('list').innerHTML = data.map(s => `
                <div class="card">
                    <div><b>《${s.title}》</b> - ${s.artist} (${s.year})</div>
                    <a class="yt-link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(s.title + ' ' + s.artist)}" target="_blank">YouTube</a>
                </div>
            `).join('');
        }
        render(songs);
    </script>
</body>
</html>
